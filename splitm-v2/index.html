<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" id="theme-color-meta" />
    <title>SplitM — Smart Group Expense & Settlement Dashboard</title>
    <meta name="description" content="Split group expenses fairly with exact integer-cent precision, zero-sum debt simplification, and 1-tap settlements." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('splitm_theme');
          var theme = saved || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.content = (theme === 'dark') ? '#191816' : '#F7F4EE';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      @keyframes splitmZoomIn {
        0% { transform: scale(0.6); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes splitmShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .splitm-fallback-btn {
        transition: all 0.2s ease;
      }
      .splitm-fallback-btn:hover {
        transform: translateY(-1px);
        opacity: 0.92;
      }
    </style>
  </head>
  <body class="bg-background text-slate-100 antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root">
      <div id="splitm-initial-splash" style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'DM Sans',system-ui,-apple-system,sans-serif; text-align:center; position:relative; overflow:hidden;">
        <!-- Authentic SplitM Dual-Stroke SVG Mark -->
        <svg viewBox="0 0 100 100" style="width:96px; height:96px; margin-bottom:14px; filter:drop-shadow(0 4px 16px rgba(56,189,248,0.3)); animation:splitmZoomIn 0.8s cubic-bezier(0.175,0.885,0.32,1.275) forwards;">
          <path d="M15 85 L15 35 L40 60 L60 30" fill="none" stroke="#004aad" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M40 85 L60 55 L85 85 L85 30" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

        <!-- Authentic Dual-Gradient Logo Typography -->
        <h1 style="margin:0; font-size:2.25rem; font-weight:800; letter-spacing:-0.02em; line-height:1;">
          <span style="background:linear-gradient(90deg,#004aad,#38bdf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Split</span><span style="color:#38bdf8; text-shadow:0 0 16px rgba(56,189,248,0.6);">M</span>
        </h1>

        <!-- Shimmering Skeleton Loader Bar from Original SplitM -->
        <div style="width:160px; height:8px; border-radius:999px; background:rgba(120,130,150,0.2); overflow:hidden; position:relative; margin-top:20px;">
          <div style="position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(56,189,248,0.7),transparent); animation:splitmShimmer 1.5s infinite linear;"></div>
        </div>

        <p style="font-size:0.75rem; font-family:'JetBrains Mono',monospace; color:#888; margin-top:12px; letter-spacing:0.08em; text-transform:uppercase;">Loading SplitM...</p>
      </div>
    </div>

    <!-- 5-Second Visible Fallback Guard -->
    <script>
      window.__splitm_mounted = false;
      setTimeout(function() {
        if (!window.__splitm_mounted) {
          var root = document.getElementById('root');
          var splash = document.getElementById('splitm-initial-splash');
          if (splash || (root && (!root.firstElementChild || root.innerText.trim() === 'Loading SplitM...'))) {
            var isDark = document.documentElement.classList.contains('dark');
            var bgCard = isDark ? '#111827' : '#ffffff';
            var borderCard = isDark ? '#1f293d' : '#e2e8f0';
            var textColor = isDark ? '#f8fafc' : '#0f172a';
            var subColor = isDark ? '#94a3b8' : '#64748b';
            root.innerHTML = '' +
              '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; font-family:system-ui,-apple-system,sans-serif; text-align:center;">' +
                '<div style="max-width:440px; width:100%; background:' + bgCard + '; border:1px solid ' + borderCard + '; border-radius:16px; padding:2rem; box-shadow:0 20px 25px -5px rgba(0,0,0,0.3);">' +
                  '<div style="width:48px; height:48px; margin:0 auto 1rem; border-radius:12px; background:rgba(99,102,241,0.15); display:flex; align-items:center; justify-content:center; font-size:1.5rem;">⚡</div>' +
                  '<h2 style="font-size:1.25rem; font-weight:700; margin:0 0 0.5rem; color:' + textColor + ';">Taking longer than usual to load</h2>' +
                  '<p style="font-size:0.875rem; color:' + subColor + '; margin:0 0 1.5rem; line-height:1.5;">SplitM may have encountered a network timeout, missing credentials, or cached data.</p>' +
                  '<div style="display:flex; flex-direction:column; gap:0.6rem;">' +
                    '<button class="splitm-fallback-btn" onclick="window.location.reload(true)" style="background:#6366f1; color:#ffffff; border:none; padding:0.75rem 1.25rem; border-radius:10px; font-weight:600; cursor:pointer; font-size:0.875rem;">Reload App</button>' +
                    '<button class="splitm-fallback-btn" onclick="if(window.navigator&&navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister()})});caches.keys().then(function(k){k.forEach(function(c){caches.delete(c)})})};try{localStorage.clear()}catch(e){};window.location.reload(true)" style="background:transparent; color:' + subColor + '; border:1px solid ' + borderCard + '; padding:0.7rem 1.25rem; border-radius:10px; font-weight:500; cursor:pointer; font-size:0.875rem;">Clear Cache & Reload</button>' +
                  '</div>' +
                '</div>' +
              '</div>';
          }
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
