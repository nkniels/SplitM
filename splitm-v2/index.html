<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" id="theme-color-meta" />
    <title>SplitM — Smart Group Expense & Settlement Dashboard</title>
    <meta name="description" content="Split group expenses fairly with exact integer-cent precision, zero-sum debt simplification, and 1-tap settlements." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('splitm_theme');
          var theme = saved || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.content = (theme === 'dark') ? '#191816' : '#F7F4EE';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      @keyframes splitmPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .skel-block {
        background: rgba(140, 150, 165, 0.16);
        animation: splitmPulse 1.8s ease-in-out infinite;
      }
      .dark .skel-block {
        background: rgba(255, 255, 255, 0.08);
      }
      .skel-card {
        background: #FFFFFF;
        border: 1px solid #E5E0D5;
      }
      .dark .skel-card {
        background: #22201D;
        border: 1px solid #36322C;
      }
      .skel-avatar {
        position: absolute;
        width: 38px;
        height: 38px;
        border-radius: 999px;
        background: rgba(140, 150, 165, 0.2);
        border: 2px solid rgba(220, 215, 205, 0.8);
        transform: translate(-50%, -50%);
        animation: splitmPulse 1.8s ease-in-out infinite;
      }
      .dark .skel-avatar {
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(60, 55, 48, 0.9);
      }
      .splitm-fallback-btn {
        transition: all 0.2s ease;
      }
      .splitm-fallback-btn:hover {
        transform: translateY(-1px);
        opacity: 0.92;
      }
    </style>
  </head>
  <body class="bg-background text-primary antialiased selection:bg-accent/20">
    <div id="root">
      <!-- High-Fidelity UI Skeleton Placeholder (Loads instantly before JS bundles) -->
      <div id="splitm-initial-skeleton" style="min-height:100vh; max-width:448px; margin:0 auto; padding:16px; display:flex; flex-direction:column; justify-content:space-between; box-sizing:border-box;">
        <!-- Header Skeleton -->
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="skel-block" style="width:32px; height:32px; border-radius:10px;"></div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="skel-block" style="width:32px; height:32px; border-radius:10px;"></div>
            <div class="skel-block" style="width:32px; height:32px; border-radius:999px;"></div>
          </div>
        </div>

        <!-- Main Card Skeleton with Inner Avatars -->
        <div class="skel-card" style="border-radius:24px; padding:28px 24px; min-height:280px; position:relative; overflow:hidden; box-sizing:border-box;">
          <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <div class="skel-block" style="width:84px; height:12px; border-radius:4px;"></div>
            <div class="skel-block" style="width:60px; height:12px; border-radius:4px;"></div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:center; margin:16px 0 24px;">
            <div class="skel-block" style="width:190px; height:26px; border-radius:8px; margin-bottom:8px;"></div>
            <div class="skel-block" style="width:130px; height:14px; border-radius:4px; margin-bottom:12px;"></div>
            <div class="skel-block" style="width:160px; height:22px; border-radius:999px;"></div>
          </div>
          <!-- Financial Grid -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; padding-top:16px; border-top:1px dashed rgba(140,150,165,0.2);">
            <div class="skel-block" style="height:56px; border-radius:12px;"></div>
            <div class="skel-block" style="height:56px; border-radius:12px;"></div>
          </div>
          <!-- Inner Floating Avatars (Clear of centered title) -->
          <div class="skel-avatar" style="left:12%; top:18%;"></div>
          <div class="skel-avatar" style="left:88%; top:18%;"></div>
          <div class="skel-avatar" style="left:90%; top:54%;"></div>
          <div class="skel-avatar" style="left:80%; top:86%;"></div>
          <div class="skel-avatar" style="left:20%; top:86%;"></div>
          <div class="skel-avatar" style="left:10%; top:54%;"></div>
        </div>

        <!-- Secondary Inactive Card Skeleton -->
        <div class="skel-card" style="border-radius:24px; padding:20px; min-height:160px; position:relative; margin-top:20px; opacity:0.85; box-sizing:border-box;">
          <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
            <div class="skel-block" style="width:70px; height:10px; border-radius:4px;"></div>
            <div class="skel-block" style="width:50px; height:10px; border-radius:4px;"></div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:center; margin:10px 0;">
            <div class="skel-block" style="width:140px; height:20px; border-radius:6px; margin-bottom:6px;"></div>
            <div class="skel-block" style="width:100px; height:12px; border-radius:4px;"></div>
          </div>
          <div class="skel-avatar" style="left:16%; top:30%; width:28px; height:28px;"></div>
          <div class="skel-avatar" style="left:84%; top:30%; width:28px; height:28px;"></div>
        </div>

        <!-- Bottom Navigation Dock Skeleton -->
        <div style="margin-top:28px; height:56px; border-radius:24px; display:flex; align-items:center; justify-content:space-around; padding:0 8px;" class="skel-card">
          <div class="skel-block" style="width:24px; height:24px; border-radius:6px;"></div>
          <div class="skel-block" style="width:24px; height:24px; border-radius:6px;"></div>
          <div class="skel-block" style="width:40px; height:40px; border-radius:999px; position:relative; top:-8px;"></div>
          <div class="skel-block" style="width:24px; height:24px; border-radius:6px;"></div>
          <div class="skel-block" style="width:24px; height:24px; border-radius:6px;"></div>
        </div>
      </div>
    </div>

    <!-- 5-Second Visible Fallback Guard -->
    <script>
      window.__splitm_mounted = false;
      setTimeout(function() {
        if (!window.__splitm_mounted) {
          var root = document.getElementById('root');
          var splash = document.getElementById('splitm-initial-splash');
          if (splash || (root && (!root.firstElementChild || root.innerText.trim() === 'Loading SplitM...'))) {
            var isDark = document.documentElement.classList.contains('dark');
            var bgCard = isDark ? '#111827' : '#ffffff';
            var borderCard = isDark ? '#1f293d' : '#e2e8f0';
            var textColor = isDark ? '#f8fafc' : '#0f172a';
            var subColor = isDark ? '#94a3b8' : '#64748b';
            root.innerHTML = '' +
              '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; font-family:system-ui,-apple-system,sans-serif; text-align:center;">' +
                '<div style="max-width:440px; width:100%; background:' + bgCard + '; border:1px solid ' + borderCard + '; border-radius:16px; padding:2rem; box-shadow:0 20px 25px -5px rgba(0,0,0,0.3);">' +
                  '<div style="width:48px; height:48px; margin:0 auto 1rem; border-radius:12px; background:rgba(99,102,241,0.15); display:flex; align-items:center; justify-content:center; font-size:1.5rem;">⚡</div>' +
                  '<h2 style="font-size:1.25rem; font-weight:700; margin:0 0 0.5rem; color:' + textColor + ';">Taking longer than usual to load</h2>' +
                  '<p style="font-size:0.875rem; color:' + subColor + '; margin:0 0 1.5rem; line-height:1.5;">SplitM may have encountered a network timeout, missing credentials, or cached data.</p>' +
                  '<div style="display:flex; flex-direction:column; gap:0.6rem;">' +
                    '<button class="splitm-fallback-btn" onclick="window.location.reload(true)" style="background:#6366f1; color:#ffffff; border:none; padding:0.75rem 1.25rem; border-radius:10px; font-weight:600; cursor:pointer; font-size:0.875rem;">Reload App</button>' +
                    '<button class="splitm-fallback-btn" onclick="if(window.navigator&&navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister()})});caches.keys().then(function(k){k.forEach(function(c){caches.delete(c)})})};try{localStorage.clear()}catch(e){};window.location.reload(true)" style="background:transparent; color:' + subColor + '; border:1px solid ' + borderCard + '; padding:0.7rem 1.25rem; border-radius:10px; font-weight:500; cursor:pointer; font-size:0.875rem;">Clear Cache & Reload</button>' +
                  '</div>' +
                '</div>' +
              '</div>';
          }
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
